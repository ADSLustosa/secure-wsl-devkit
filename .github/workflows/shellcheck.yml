name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Análise estática dos scripts
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rodar o ShellCheck
        run: shellcheck setup.sh tests/*.sh

      - name: Verificar se as actions estão fixadas por SHA
        run: tests/check-pinned-actions.sh
