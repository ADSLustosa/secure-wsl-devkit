name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Análise estática dos scripts
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Rodar o ShellCheck
        run: shellcheck setup.sh tests/*.sh

      - name: Verificar se as actions estão fixadas por SHA
        run: tests/check-pinned-actions.sh
