<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">secure-wsl-devkit</title>
<desc id="desc">Project banner: a shield with a check mark, the project name and its main features.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#eef1f4" stroke-width="1"/>
  </pattern>
  <radialGradient id="glow"><stop offset="0" stop-color="#0e7490" stop-opacity="0.28"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="shineGrad" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.65"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7490" stop-opacity="0"/><stop offset="0.7" stop-color="#0e7490" stop-opacity="0.10"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></linearGradient>
  <clipPath id="frame"><rect width="1200" height="340" rx="16"/></clipPath>
  <clipPath id="titleClip"><text x="330" y="150" class="title">secure-wsl-devkit</text></clipPath>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.title { font-size: 64px; font-weight: 800; fill: #1f2328; letter-spacing: -1px; }
.tagline { font-size: 22px; fill: #59636e; }
.chip { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 15px; fill: #1f2328; }
.prompt { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 16px; fill: #59636e; }
.prompt .dollar { fill: #1a7f37; }
.ring { fill: none; stroke: #0e7490; stroke-width: 2; opacity: 0;
  transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-out infinite; }
.check { fill: none; stroke: #ffffff; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 90; stroke-dashoffset: 0; animation: draw 0.9s 0.4s ease-out both; }
.shine { transform: translateX(-700px); animation: shine 6s 1.2s ease-in-out infinite; }
.scan { transform: translateY(-140px); animation: scan 7s linear infinite; }
.fade { animation: fadeUp 0.6s ease-out both; }
.cursor { animation: blink 1.1s steps(1) infinite; }
@keyframes pulse { 0% { transform: scale(0.9); opacity: 0.6; } 100% { transform: scale(1.65); opacity: 0; } }
@keyframes draw { 0% { stroke-dashoffset: 90; opacity: 0; } 10% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
@keyframes shine { 0% { transform: translateX(-700px); } 45%, 100% { transform: translateX(800px); } }
@keyframes scan { from { transform: translateY(-140px); } to { transform: translateY(360px); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="340" fill="#ffffff"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="170" cy="170" r="190" fill="url(#glow)"/>
  <rect class="scan" width="1200" height="120" fill="url(#scanGrad)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#d0d7de"/>
<circle class="ring" cx="170" cy="170" r="84"/>
<circle class="ring" cx="170" cy="170" r="84" style="animation-delay:1.6s"/>
<path d="M170 88 L234 113 V168 C234 210 206 240 170 254 C134 240 106 210 106 168 V113 Z" fill="url(#shield)"/>
<path d="M170 88 L234 113 V168 C234 210 206 240 170 254 C134 240 106 210 106 168 V113 Z" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
<path class="check" d="M141 170 L162 191 L201 150"/>
<text x="330" y="150" class="title">secure-wsl-devkit</text>
<g clip-path="url(#titleClip)"><rect class="shine" x="330" y="80" width="180" height="90" fill="url(#shineGrad)"/></g>
<text x="330" y="194" class="tagline fade" style="animation-delay:0.5s">Automated, idempotent and security-first WSL 2 setup</text>
<g class="fade" style="animation-delay:0.90s"><rect x="330" y="226" width="130" height="34" rx="17" fill="#f6f8fa" stroke="#d0d7de"/><text x="395" y="248" text-anchor="middle" class="chip">idempotent</text></g><g class="fade" style="animation-delay:1.08s"><rect x="472" y="226" width="168" height="34" rx="17" fill="#f6f8fa" stroke="#d0d7de"/><text x="556" y="248" text-anchor="middle" class="chip">signed commits</text></g><g class="fade" style="animation-delay:1.26s"><rect x="652" y="226" width="177" height="34" rx="17" fill="#f6f8fa" stroke="#d0d7de"/><text x="740" y="248" text-anchor="middle" class="chip">least privilege</text></g>
<text x="330" y="303" class="prompt fade" style="animation-delay:1.5s"><tspan class="dollar">$</tspan> ./setup.sh</text>
<g class="fade" style="animation-delay:1.5s"><rect class="cursor" x="453" y="290" width="9" height="17" fill="#0e7490"/></g>
</svg>
