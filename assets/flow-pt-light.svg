<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Como o setup.sh funciona</title>
<desc id="desc">Oito etapas em ordem: verificação do ambiente, pacotes base, Git e assinatura, template do pre-commit, corte do PATH do Windows, liberação do VS Code, Node.js LTS e verificação do Docker. As quatro primeiras sempre executam, as três seguintes são puladas quando já feitas, e a do Docker apenas verifica e avisa.</desc>
