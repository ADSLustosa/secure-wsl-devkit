city: 0; } } .k5 { animation: k5 7.5s linear infinite; } @keyframes k5 { 0%, 53.57% { opacity: 0; } 55.57%, 94% { opacity: 1; } 100% { opacity: 0; } } .k6 { animation: k6 7.5s linear infinite; } @keyframes k6 { 0%, 64.29% { opacity: 0; } 66.29%, 94% { opacity: 1; } 100% { opacity: 0; } } .k7 { animation: k7 7.5s linear infinite; } @keyframes k7 { 0%, 75.00% { opacity: 0; } 77.00%, 94% { opacity: 1; } 100% { opacity: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
