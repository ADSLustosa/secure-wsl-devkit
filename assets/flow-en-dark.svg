<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="300" viewBox="0 0 1360 300" role="img" aria-labelledby="title desc">
<title id="title">How setup.sh works</title>
<desc id="desc">Ten steps run in order: check environment, base packages, Git and signing, pre-commit template, SSH agent, cut the Windows PATH, PATH allowlist, Node.js LTS, Docker check and VS Code check. The first four always run, the next four are skipped when already done, and the last two only check and warn.</desc>
