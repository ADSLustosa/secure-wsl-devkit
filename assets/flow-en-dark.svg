<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">How setup.sh works</title>
<desc id="desc">Eight steps run in order: check environment, base packages, Git and signing, pre-commit template, cut the Windows PATH, PATH allowlist, Node.js LTS and Docker check. The first four always run, the next three are skipped when already done, and the Docker step only checks and warns.</desc>
