 0; } } .k5 { animation: k5 7.5s linear infinite; } @keyframes k5 { 0%, 62.50% { opacity: 0; } 64.50%, 94% { opacity: 1; } 100% { opacity: 0; } } .k6 { animation: k6 7.5s linear infinite; } @keyframes k6 { 0%, 75.00% { opacity: 0; } 77.00%, 94% { opacity: 1; } 100% { opacity: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
