<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Every change passes four gates</title>
<desc id="desc">A signed commit passes four gates (signed commit, pull request only, ShellCheck CI and verified commits only) and reaches the protected main branch. A direct push is rejected at the pull request gate.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; } .title { font-size: 26px; font-weight: 800; fill: #e6edf3; } .sub { font-size: 15px; fill: #8b949e; } .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }  .gtitle { font-size: 14px; font-weight: 700; fill: #e6edf3; } .gdetail { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 12px; fill: #8b949e; } .packet { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 13px; font-weight: 700; } .ok { transform: translateX(1000.0px); animation: ok 9.0s cubic-bezier(.45,0,.55,1) infinite; } @keyframes ok { 0% { transform: translateX(0); opacity: 1; } 50% { transform: translateX(1000.0px); } 94% { opacity: 1; } 100% { transform: translateX(1000.0px); opacity: 0; } } .bad { transform: translateX(348.0px); animation: bad 9.0s ease-in-out infinite; } @keyframes bad { 0%, 52% { transform: translateX(0); opacity: 0; } 54% { opacity: 1; } 74% { transform: translateX(348.0px); } 75.5% { transform: translateX(338.0px); } 77% { transform: translateX(348.0px); } 78.5% { transform: translateX(342.0px); } 80%, 94% { transform: translateX(348.0px); opacity: 1; } 100% { transform: translateX(348.0px); opacity: 0; } } .flash { opacity: 0; animation: flash 9.0s linear infinite; } @keyframes flash { 0%, 73% { opacity: 0; } 75% { opacity: 1; } 78% { opacity: 0.3; } 81% { opacity: 1; } 86%, 100% { opacity: 0; } } .blocked { animation: blocked 9.0s linear infinite; } @keyframes blocked { 0%, 80.00% { opacity: 0; } 82.00%, 94% { opacity: 1; } 100% { opacity: 0; } } .target { animation: target 9.0s linear infinite; } @keyframes target { 0%, 48.00% { opacity: 0; } 50.00%, 94% { opacity: 1; } 100% { opacity: 0; } } .g0 { animation: g0 9.0s linear infinite; } @keyframes g0 { 0%, 13.00% { opacity: 0; } 15.00%, 94% { opacity: 1; } 100% { opacity: 0; } } .g1 { animation: g1 9.0s linear infinite; } @keyframes g1 { 0%, 23.00% { opacity: 0; } 25.00%, 94% { opacity: 1; } 100% { opacity: 0; } } .g2 { animation: g2 9.0s linear infinite; } @keyframes g2 { 0%, 33.00% { opacity: 0; } 35.00%, 94% { opacity: 1; } 100% { opacity: 0; } } .g3 { animation: g3 9.0s linear infinite; } @keyframes g3 { 0%, 43.00% { opacity: 0; } 45.00%, 94% { opacity: 1; } 100% { opacity: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect x="0.5" y="0.5" width="1199" height="329" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="54" class="title">Every change passes four gates</text>
<text x="32" y="82" class="sub">A signed commit reaches main only through a pull request with a green CI; a direct push is rejected</text>
<path d="M40 190 H1030" stroke="#30363d" stroke-dasharray="4 7"/>
<path d="M40 258 H1030" stroke="#30363d" stroke-dasharray="4 7"/>
<text x="360" y="116" text-anchor="middle" class="gtitle">Signed commit</text><text x="360" y="134" text-anchor="middle" class="gdetail">ssh-ed25519</text><rect x="354" y="142" width="12" height="140" rx="6" fill="#30363d"/><rect class="g0" x="354" y="142" width="12" height="140" rx="6" fill="#3fb950"/>
<text x="560" y="116" text-anchor="middle" class="gtitle">Pull request only</text><text x="560" y="134" text-anchor="middle" class="gdetail">ruleset</text><rect x="554" y="142" width="12" height="140" rx="6" fill="#30363d"/><rect class="g1" x="554" y="142" width="12" height="140" rx="6" fill="#3fb950"/>
<rect class="flash" x="554" y="142" width="12" height="140" rx="6" fill="#f85149"/>
<text x="760" y="116" text-anchor="middle" class="gtitle">ShellCheck CI</text><text x="760" y="134" text-anchor="middle" class="gdetail">github actions</text><rect x="754" y="142" width="12" height="140" rx="6" fill="#30363d"/><rect class="g2" x="754" y="142" width="12" height="140" rx="6" fill="#3fb950"/>
<text x="960" y="116" text-anchor="middle" class="gtitle">Verified only</text><text x="960" y="134" text-anchor="middle" class="gdetail">ruleset</text><rect x="954" y="142" width="12" height="140" rx="6" fill="#30363d"/><rect class="g3" x="954" y="142" width="12" height="140" rx="6" fill="#3fb950"/>
<rect x="1030" y="142" width="140" height="140" rx="14" fill="#161b22" stroke="#30363d"/><rect class="target" x="1030" y="142" width="140" height="140" rx="14" fill="none" stroke="#3fb950" stroke-width="2"/><text x="1100.0" y="170" text-anchor="middle" class="mono" font-size="18" font-weight="700" fill="#e6edf3">main</text><text x="1100.0" y="264" text-anchor="middle" class="gdetail">protected</text>
<g class="ok"><rect x="40" y="175" width="120" height="30" rx="15" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950"/><text x="100.0" y="195" text-anchor="middle" class="packet" fill="#3fb950">✓ commit</text></g>
<g class="bad"><rect x="40" y="243" width="160" height="30" rx="15" fill="#f85149" fill-opacity="0.14" stroke="#f85149"/><text x="120.0" y="263" text-anchor="middle" class="packet" fill="#f85149">✕ direct push</text></g>
<text class="blocked mono" x="468.0" y="308" text-anchor="middle" font-size="12" fill="#f85149">rejected: changes must go through a pull request</text>
</svg>
