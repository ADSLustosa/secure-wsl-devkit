<text x="600.0" y="156" text-anchor="middle" class="label done fade" style="animation-delay:1.70s">Docs animadas</text>
<g class="pop" style="animation-delay:1.90s"><circle class="ring" cx="727.5" cy="188" r="15"/><circle cx="727.5" cy="188" r="15" fill="#0d1117" stroke="#22d3ee" stroke-width="2"/><circle cx="727.5" cy="188" r="5" fill="#22d3ee"/></g>
