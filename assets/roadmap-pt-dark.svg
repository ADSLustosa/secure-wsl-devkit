<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Roadmap</title>
<desc id="desc">5 de 9 entregas concluídas · próxima: CI em distro zerada. Setup idempotente: done; Commits assinados: done; PATH seletivo: done; CI + main protegida: done; Docs animadas: done; CI em distro zerada: planned; Contêineres: planned; Gitleaks: planned; Actions fixadas: planned</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; } .title { font-size: 26px; font-weight: 800; fill: #e6edf3; } .sub { font-size: 15px; fill: #8b949e; } .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }  .label { font-size: 14px; fill: #8b949e; } .label.done { fill: #e6edf3; } .label.next { fill: #22d3ee; font-weight: 700; } .check { font-size: 15px; font-weight: 800; fill: #ffffff; } .rfill { transform-box: fill-box; transform-origin: left center; animation: grow 1.4s 0.3s linear both; } @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } } .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.45s cubic-bezier(.3,1.6,.5,1) both; } @keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } } .fade { animation: fade 0.5s ease-out both; } @keyframes fade { from { opacity: 0; } to { opacity: 1; } } .ring { fill: none; stroke: #22d3ee; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ring 2s 2.2s ease-out infinite; } @keyframes ring { 0% { transform: scale(0.9); opacity: 0.7; } 100% { transform: scale(2); opacity: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#0d1117" stroke="#30363d"/>
