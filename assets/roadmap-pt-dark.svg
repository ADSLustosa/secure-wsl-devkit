<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Roadmap</title>
<desc id="desc">Todas as 10 entregas concluídas · seguro, testado e reproduzível. Setup idempotente: done; Commits assinados: done; PATH seletivo: done; CI + main protegida: done; Docs animadas: done; CI em distro zerada: done; Contêineres: done; Gitleaks: done; Actions fixadas: done; 2ª máquina: done</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; } .title { font-size: 26px; font-weight: 800; fill: #e6edf3; } .sub { font-size: 15px; fill: #8b949e; } .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }  .label { font-size: 14px; fill: #8b949e; } .label.done { fill: #e6edf3; } .label.next { fill: #22d3ee; font-weight: 700; } .check { font-size: 15px; font-weight: 800; fill: #ffffff; } .rfill { transform-box: fill-box; transform-origin: left center; animation: grow 1.4s 0.3s linear both; } @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } } .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.45s cubic-bezier(.3,1.6,.5,1) both; } @keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } } .fade { animation: fade 0.5s ease-out both; } @keyframes fade { from { opacity: 0; } to { opacity: 1; } } .ring { fill: none; stroke: #22d3ee; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ring 2s 2.2s ease-out infinite; } @keyframes ring { 0% { transform: scale(0.9); opacity: 0.7; } 100% { transform: scale(2); opacity: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="54" class="title">Roadmap</text>
<text x="32" y="82" class="sub">Todas as 10 entregas concluídas · seguro, testado e reproduzível</text>
<rect x="90" y="185" width="1020" height="6" rx="3" fill="#30363d"/>
<rect class="rfill" x="90" y="185" width="1020.0" height="6" rx="3" fill="#3fb950"/>
<g class="pop" style="animation-delay:0.30s"><circle cx="90.0" cy="188" r="15" fill="#3fb950"/><text x="90.0" y="193" text-anchor="middle" class="check">✓</text></g>
<text x="90.0" y="156" text-anchor="middle" class="label done fade" style="animation-delay:0.30s">Setup idempotente</text>
<g class="pop" style="animation-delay:0.46s"><circle cx="203.3" cy="188" r="15" fill="#3fb950"/><text x="203.3" y="193" text-anchor="middle" class="check">✓</text></g>
<text x="203.3" y="232" text-anchor="middle" class="label done fade" style="animation-delay:0.46s">Commits assinados</text>
<g class="pop" style="animation-delay:0.61s"><circle cx="316.7" cy="188" r="15" fill="#3fb950"/><text x="316.7" y="193" text-anchor="middle" class="check">✓</text></g>
<text x="316.7" y="156" text-anchor="middle" class="label done fade" style="animation-delay:0.61s">PATH seletivo</text>
<g class="pop" style="animation-delay:0.77s"><circle cx="430.0" cy="188" r="15" fill="#3fb950"/><text x="430.0" y="193" text-anchor="middle" class="check">✓</text></g>
<text x="430.0" y="232" text-anchor="middle" class="label done fade" style="animation-delay:0.77s">CI + main protegida</text>
<g class="pop" style="animation-delay:0.92s"><circle cx="543.3" cy="188" r="15" fill="#3fb950"/><text x="543.3" y="193" text-anchor="middle" class="check">✓</text></g>
<text x="543.3" y="156" text-anchor="middle" class="label done fade" style="animation-delay:0.92s">Docs animadas</text>
<g class="pop" style="animation-delay:1.08s"><circle cx="656.7" cy="188" r="15" fill="#3fb950"/><text x="656.7" y="193" text-anchor="middle" class="check">✓</text></g>
<text x="656.7" y="232" text-anchor="middle" class="label done fade" style="animation-delay:1.08s">CI em distro zerada</text>
<g class="pop" style="animation-delay:1.23s"><circle cx="770.0" cy="188" r="15" fill="#3fb950"/><text x="770.0" y="193" text-anchor="middle" class="check">✓</text></g>
<text x="770.0" y="156" text-anchor="middle" class="label done fade" style="animation-delay:1.23s">Contêineres</text>
<g class="pop" style="animation-delay:1.39s"><circle cx="883.3" cy="188" r="15" fill="#3fb950"/><text x="883.3" y="193" text-anchor="middle" class="check">✓</text></g>
<text x="883.3" y="232" text-anchor="middle" class="label done fade" style="animation-delay:1.39s">Gitleaks</text>
<g class="pop" style="animation-delay:1.54s"><circle cx="996.7" cy="188" r="15" fill="#3fb950"/><text x="996.7" y="193" text-anchor="middle" class="check">✓</text></g>
<text x="996.7" y="156" text-anchor="middle" class="label done fade" style="animation-delay:1.54s">Actions fixadas</text>
<g class="pop" style="animation-delay:1.70s"><circle cx="1110.0" cy="188" r="15" fill="#3fb950"/><text x="1110.0" y="193" text-anchor="middle" class="check">✓</text></g>
<text x="1110.0" y="232" text-anchor="middle" class="label done fade" style="animation-delay:1.70s">2ª máquina</text>
</svg>
