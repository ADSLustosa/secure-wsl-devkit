<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">How setup.sh works</title>
<desc id="desc">Six steps run in order: check environment, base packages, Git and signing, cut the Windows PATH, PATH allowlist and Node.js LTS. The first three always run; the last three are skipped when already done.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; } .title { font-size: 26px; font-weight: 800; fill: #1f2328; } .sub { font-size: 15px; fill: #59636e; } .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }  .step { font-size: 14px; font-weight: 700; fill: #1f2328; } .detail { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 12px; fill: #59636e; } .num { font-size: 13px; font-weight: 700; fill: #1f2328; } .pill { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 11px; } .track { transform-box: fill-box; transform-origin: left center; transform: scaleX(1); animation: track 7.5s linear infinite; } @keyframes track { 0% { transform: scaleX(0); opacity: 1; } 75% { transform: scaleX(1); } 94% { opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } } .dot { transform: translateX(963.3px); animation: dot 7.5s linear infinite; } @keyframes dot { 0% { transform: translateX(0); opacity: 1; } 75% { transform: translateX(963.3px); } 94% { opacity: 1; } 100% { transform: translateX(963.3px); opacity: 0; } } .k0 { animation: k0 7.5s linear infinite; } @keyframes k0 { 0%, 0.00% { opacity: 0; } 2.00%, 94% { opacity: 1; } 100% { opacity: 0; } } .k1 { animation: k1 7.5s linear infinite; } @keyframes k1 { 0%, 15.00% { opacity: 0; } 17.00%, 94% { opacity: 1; } 100% { opacity: 0; } } .k2 { animation: k2 7.5s linear infinite; } @keyframes k2 { 0%, 30.00% { opacity: 0; } 32.00%, 94% { opacity: 1; } 100% { opacity: 0; } } .k3 { animation: k3 7.5s linear infinite; } @keyframes k3 { 0%, 45.00% { opacity: 0; } 47.00%, 94% { opacity: 1; } 100% { opacity: 0; } } .k4 { animation: k4 7.5s linear infinite; } @keyframes k4 { 0%, 60.00% { opacity: 0; } 62.00%, 94% { opacity: 1; } 100% { opacity: 0; } } .k5 { animation: k5 7.5s linear infinite; } @keyframes k5 { 0%, 75.00% { opacity: 0; } 77.00%, 94% { opacity: 1; } 100% { opacity: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
